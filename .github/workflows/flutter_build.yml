name: AI App Factory - Flutter Build Pipeline

on:
  repository_dispatch:
    types: [build_flutter_apk, publish_play_store]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Clean Flutter Project
        run: |
          mkdir -p lib android/app/src/main
          cat << 'PUBSPEC' > pubspec.yaml
          name: ai_app
          description: AI Generated Flutter Application
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            go_router: ^13.2.0
            google_fonts: ^6.1.0
          flutter:
            uses-material-design: true
          PUBSPEC

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Inject AI Generated Flutter Source Code
        run: |
          mkdir -p lib
          printf '%s' "${{ github.event.client_payload.main_dart_code }}" > lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK & AAB Bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.event.client_payload.app_id }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Publish to Google Play (on publish event only)
        if: github.event.action == 'publish_play_store'
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          cd android
          bundle exec fastlane supply --aab ../build/app/outputs/bundle/release/app-release.aab --track production
