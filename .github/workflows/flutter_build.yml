name: AI App Factory - Flutter Build Pipeline
run-name: "Build ${{ github.event.client_payload.app_name || github.event.client_payload.app_id }} (${{ github.event.client_payload.package_name }})"

on:
  repository_dispatch:
    types: [build_flutter_apk, publish_play_store]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Project via flutter create
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name || 'com.appfactory.app' }}"
          # Extract org domain from package name (e.g. com.appfactory from com.appfactory.auto.756)
          ORG_DOMAIN=$(echo "$PACKAGE_NAME" | sed 's/.[^.]*$//')
          if [ -z "$ORG_DOMAIN" ]; then ORG_DOMAIN="com.appfactory"; fi
          
          flutter create --org "$ORG_DOMAIN" --project-name "app_${{ github.event.client_payload.app_id || 'main' }}" . || flutter create --org com.appfactory --project-name app_main .
          flutter pub add flutter_riverpod go_router google_fonts

      - name: Upgrade Gradle Wrapper to 8.3 (Prevents Gradle 7.6.3 download errors)
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-7.[0-9]+.[0-9]+-all.zip/gradle-8.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-7.[0-9]+-all.zip/gradle-8.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Inject AI Generated Flutter Source Code
        env:
          DART_CODE: ${{ github.event.client_payload.main_dart_code }}
        run: |
          python3 - << 'PYEOF'
          import os, textwrap

          DEFAULT_APP = textwrap.dedent("""
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AI App Factory',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                  useMaterial3: true,
                ),
                home: const Scaffold(
                  backgroundColor: Colors.white,
                  body: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.rocket_launch, size: 72, color: Colors.deepPurple),
                        SizedBox(height: 20),
                        Text(
                          'AI App Factory',
                          style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.deepPurple),
                        ),
                        SizedBox(height: 10),
                        Text('Your AI-generated app is ready!', style: TextStyle(color: Colors.grey)),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          """).strip()

          code = os.environ.get('DART_CODE', '').strip()
          if not code or code in ('null', '// AI source code pending generation'):
              print("WARNING: No AI source code in payload, using default app")
              code = DEFAULT_APP

          with open('lib/main.dart', 'w') as f:
              f.write(code)

          print(f"OK: lib/main.dart written ({len(code.splitlines())} lines)")
          PYEOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB Bundle
        run: flutter build appbundle --release

      - name: Upload Binaries directly to Cloudflare R2 Bucket 📦
        if: success()
        run: |
          APP_ID="${{ github.event.client_payload.app_id }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          if [ -n "$CALLBACK_URL" ] && [ -n "$APP_ID" ]; then
            APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
            if [ -f "$APK_FILE" ]; then
              curl -s -X POST "$CALLBACK_URL/api/apps/$APP_ID/upload-binary?type=apk" \
                -H "Content-Type: application/vnd.android.package-archive" \
                --data-binary "@$APK_FILE" || true
            fi
            AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
            if [ -f "$AAB_FILE" ]; then
              curl -s -X POST "$CALLBACK_URL/api/apps/$APP_ID/upload-binary?type=aab" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$AAB_FILE" || true
            fi
          fi

      - name: Notify Cloudflare — Build Complete ✅
        if: always()
        run: |
          APP_ID="${{ github.event.client_payload.app_id }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          BUILD_TOKEN="${{ github.event.client_payload.build_token }}"
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          if [ -n "$CALLBACK_URL" ] && [ -n "$APP_ID" ]; then
            curl -s -X POST "$CALLBACK_URL/api/apps/$APP_ID/build-complete" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\",\"run_id\":\"${{ github.run_id }}\",\"build_token\":\"$BUILD_TOKEN\"}" || true
          fi

      - name: Publish to Google Play (on publish event only)
        if: github.event.action == 'publish_play_store'
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          cd android
          bundle exec fastlane supply --aab ../build/app/outputs/bundle/release/app-release.aab --track production
