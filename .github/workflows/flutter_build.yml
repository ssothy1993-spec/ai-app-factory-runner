name: AI App Factory - Flutter Build Pipeline

on:
  repository_dispatch:
    types: [build_flutter_apk, publish_play_store]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Project via flutter create
        run: |
          flutter create --org com.aiappfactory --project-name ai_app .
          flutter pub add flutter_riverpod go_router google_fonts

      - name: Inject AI Generated Flutter Source Code
        run: |
          APP_CODE=${{ toJSON(github.event.client_payload.main_dart_code) }}
          echo "$APP_CODE" | python3 -c "import sys,json; print(json.load(sys.stdin))" > lib/main.dart || \
          printf '%s' "${{ github.event.client_payload.main_dart_code }}" > lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB Bundle
        run: flutter build appbundle --release

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.event.client_payload.app_id || 'app' }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Notify Cloudflare — Build Complete ✅
        if: always()
        run: |
          APP_ID="${{ github.event.client_payload.app_id }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          if [ -n "$CALLBACK_URL" ] && [ -n "$APP_ID" ]; then
            curl -s -X POST "$CALLBACK_URL/api/apps/$APP_ID/build-complete" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\",\"run_id\":\"${{ github.run_id }}\"}" || true
          fi

      - name: Publish to Google Play (on publish event only)
        if: github.event.action == 'publish_play_store'
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          cd android
          bundle exec fastlane supply --aab ../build/app/outputs/bundle/release/app-release.aab --track production
